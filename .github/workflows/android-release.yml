name: Android production release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Build only: Android version code, greater than every code already on Play'
        type: string
        required: true

permissions:
  contents: read

# Serialize uploads; a newer tag must not cancel a release already submitting.
concurrency:
  group: android-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play-production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Android release version
        id: version
        env:
          ANDROID_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('android-v{0}', inputs.version_code) || github.ref_name }}
        run: npx --no-install tsx scripts/androidRelease.ts "$ANDROID_RELEASE_TAG"
      - name: Check release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64 in google-play-production}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD in google-play-production}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD in google-play-production}"
          if [ "$PUBLISH_RELEASE" = true ]; then
            : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in google-play-production}"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Restore the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
      - name: Build the signed app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: android
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          bash ./gradlew --no-daemon bundleRelease \
            "-PappVersionCode=$ANDROID_VERSION_CODE" "-PappVersionName=$ANDROID_VERSION_NAME"
          # jarsigner can exit zero for a completely unsigned archive.
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify -strict \
            -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/bundle-verification.txt"
          grep -q '^jar verified\.' "$RUNNER_TEMP/bundle-verification.txt"
      - name: Save the signed bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: paperclips-android-${{ steps.version.outputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
      - name: Submit to Google Play production
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ps.papercli.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          releaseName: Paperclips ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
          tracks: production
          status: completed
          changesNotSentForReview: false
      - name: Remove the temporary upload key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/upload.keystore"
