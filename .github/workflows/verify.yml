name: Verify
on:
  push:
    branches: ['**']
    # The Android release workflow calls this workflow for its tags.
    tags-ignore: ['android-v*']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Screenshot baselines are captured on Windows; use the same font rasterizer.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
